<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visual Feedback Tool</title>
  <style>
    body {
      width: 240px;
      padding: 16px;
      font-family: 'Cabin', system-ui, sans-serif;
      background: #f9fafb;
      margin: 0;
    }
    h1 {
      font-size: 14px;
      font-weight: 700;
      color: #0a2333;
      margin: 0 0 4px;
    }
    p {
      font-size: 11px;
      color: #6a7282;
      margin: 0 0 12px;
    }
    #url {
      font-size: 10px;
      color: #9ca3af;
      margin-bottom: 14px;
      word-break: break-all;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 6px 8px;
    }
    #activateBtn {
      width: 100%;
      padding: 9px;
      background: #0a2333;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Cabin', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #activateBtn:hover:not(:disabled) {
      background: #152c3c;
    }
    #activateBtn:disabled {
      background: #9ca3af;
      cursor: default;
    }
    #status {
      font-size: 11px;
      color: #059669;
      margin-top: 10px;
      text-align: center;
      display: none;
    }
    #error {
      font-size: 11px;
      color: #dc2626;
      margin-top: 10px;
      text-align: center;
      display: none;
    }
    .hint {
      font-size: 10px;
      color: #9ca3af;
      margin-top: 12px;
      line-height: 1.5;
    }
    .server-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #6a7282;
      margin-bottom: 12px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9ca3af;
      flex-shrink: 0;
    }
    .dot.online { background: #34d399; }
    .dot.offline { background: #ef4444; }
    #reviewBtn {
      width: 100%;
      padding: 7px;
      background: #fff;
      color: #0a2333;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-family: 'Cabin', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s;
    }
    #reviewBtn:hover { background: #f9fafb; }
    .buffer-count { font-size: 10px; color: #6a7282; text-align: center; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Visual Feedback Tool</h1>
  <p>Annotate this page and send to Claude Code.</p>
  <div class="server-status">
    <div class="dot" id="serverDot"></div>
    <span id="serverLabel">Checking server…</span>
  </div>
  <div id="url"></div>
  <button id="activateBtn">Activate Overlay</button>
  <button id="reviewBtn">Review Buffer</button>
  <div id="bufferCount" class="buffer-count"></div>
  <div id="status">✓ Overlay active — annotate the page</div>
  <div id="error"></div>
  <div class="hint">Use the toolbar to draw, highlight, and pin comments. Click <strong>Send →</strong> to add to the buffer, then <strong>Review Buffer</strong> to view all submissions.</div>
  <script src="popup.js"></script>
</body>
</html>
